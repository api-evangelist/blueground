aid: blueground
name: Blueground
description: 'Blueground is a global proptech company that leases, furnishes and operates
  move-in-ready apartments for stays of a month or longer, running thousands of units
  across cities in North America, Europe, the Middle East, Asia and Latin America.
  It operates an end-to-end technology stack: a consumer booking site and iOS/Android
  guest apps, an internal property, pricing and operations platform, and the Blueground
  Partner Network — an invite-only marketplace where third-party furnished-rental operators
  list supply and connect inventory through PMS and channel-manager integrations (Avantio,
  NextPax, Rentals United, Hostify, Hostfully, SiteMinder, Cloudbeds, Airbnb). Blueground
  publishes no public developer portal, API documentation or machine-readable contract:
  partner connectivity is brokered through channel-manager partners rather than a self-serve
  API. Its engineering organization does maintain a real open-source footprint on GitHub
  (bluegroundltd), with libraries released to Maven Central and npm, and the main website
  publishes an llms.txt.'
