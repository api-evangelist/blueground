note: >-
  Listing-only catalog of the PMS / channel-manager connections Blueground advertises
  on the Blueground Partner Network ("Connect via your PMS"). Blueground itself publishes
  no OpenAPI and no public API documentation, so NO Arazzo workflow can be authored for
  any of these — every entry is `arazzo: null` with `status: pending-provider-spec`.
  The connection is brokered by the partner platform: an operator syncs rates and
  availability from their PMS/channel manager into the Blueground Partner Network.
  Partner-side specs exist in the catalog for some of these (all/cloudbeds, all/airbnb,
  all/guesty) but the Blueground side of the workflow has no verifiable operationIds,
  so nothing is modelled rather than invented.
